name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            */pyproject.toml

      - name: Install dependencies
        run: pip install -r requirements.txt  # 세 단계 패키지와 shared 도 함께 설치

      - name: Test
        run: python -m pytest -q

  pipeline:
    name: Pipeline (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # shared: 스키마·예시·단계 사이 규칙 / 1·2·3단계: shared 예시를 입력으로 한 계약 테스트 (실제 모델 없이)
        package: [shared, vision, db_context_interpreter, calculate_reliability]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '*/pyproject.toml'

      - name: Install dependencies
        run: |
          pip install -e ../shared pytest
          pip install -e .

      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
